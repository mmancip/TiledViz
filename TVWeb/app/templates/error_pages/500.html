<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
{% extends "base_main_template.html" %}

{% block content %}


   <style>
        .error-body{
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #333;
        }
        .error-page {
            text-align: center;
            padding: 2rem;
        }
        .error-code {
            font-size: 6rem;
            font-weight: 700;
            color: #e74c3c;
            line-height: 1;
        }
        .error-title {
            font-size: 1.5rem;
            margin: 1rem 0;
        }
        .error-desc {
            font-size: 1rem;
            margin-bottom: 2rem;
        }
    </style>

<div class="error-body">
    <div class="error-page">
        <div class="error-code">500</div>
        <h1 class="error-title">Internal Server Error</h1>
        <p class="error-desc">
            An error has occured with TiledViz. We are really sorry about this.
            Please try to keep your history of actions and send them to TiledViz developpers.
        </p>
         <a href="/">
            <button type="button" name="buttonLogin" class="btn btn-primary btn-block btn-lg">Go Home</button>
        </a>
    </div>
</div>

{% endblock %}
