{% extends "base_main_template.html" %}

{% block content %}


   <style>
        .error-body{
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #333;
        }
        .error-page {
            text-align: center;
            padding: 2rem;
        }
        .error-code {
            font-size: 6rem;
            font-weight: 700;
            color: #3498db;
            line-height: 1;
        }
        .error-title {
            font-size: 1.5rem;
            margin: 1rem 0;
        }
        .error-desc {
            font-size: 1rem;
            margin-bottom: 2rem;
        }
    </style>

<div class="error-body">
    <div class="error-page">
        <div class="error-code row">404</div>
        <h1 class="error-title row">Page Not Found</h1>
        <p class="error-desc row">
            The page you are looking for might have been removed,
            had its name changed, or doesn't exist.
        </p>
        <a href="/">
            <button type="button" name="buttonLogin" class="btn btn-primary btn-block btn-lg">Go Home</button>
        </a>
    </div>
</div>

{% endblock %}
