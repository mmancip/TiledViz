[TVSecure]
# Max number of connections before relaunch TVSecure
NbSecureConnection=23

# Max number of bites keep in flaskdock log for TVSecure to be analysed. 
NbBitesLog=50k

# Start port for VNC streaming between TVConnection and FlaskDock through ssh
ConnectionPort=54040

# Start port for actions connection between TVConnection.py and TVSecure.py through socat and docker0 
ActionPort=64040

# Wait in second for nodes.json (a tile set is ready on supercomputer)
Swait=10

# Maximum waiting for nodes.json before stoping container
Mwait=1800

# Firewall with NFT
FirewallT=False

# SSH port
SSHport=22

[TVWeb]

# defaut access to HPC frontend ('ssh' for direct ssh or 'rebound' to use one or more gateways) 
AuthChoice="ssh"

# Time sleep for waiting loops in seconds : 
timeAlive=5

# Time for create and start connections in seconds
TimeConnection=30

# Boolean for admin page :
really_delete=True

# Link expired duree in seconds
LinkExpiredAfterSec=240

# Global rate limit for all pages
GlobalRateLimit=["200 per day", "50 per hour"]

# More vulnerable pages rate limit (register, login)
VulnerableRateLimit="15/hour;5/minute;1/second"

[sock]
# Default port for connection between client in sock.py and TVSecure.py 
PORTServer=55554

# Message fix size for data transfert through socket
MSGsize=1024
